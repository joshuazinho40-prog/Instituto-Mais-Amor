<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instituto Mais Amor — prévia navegável</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#26384f}.preview-tools{padding:10px 18px;background:#ffe522;border-bottom:1px solid #dce3ec;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.preview-tools strong{font-size:12px;margin-right:auto}.preview-tools button,.upload{display:inline-flex;align-items:center;min-height:38px;border:1px solid #cbd4df;border-radius:5px;background:#064bff;padding:8px 12px;color:#fff;font-size:11px;cursor:pointer}.preview-tools button:focus-visible,.upload:focus-within{outline:3px solid #167cb5;outline-offset:3px}.upload{position:relative;overflow:hidden}.upload input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}.statusline{padding:7px 18px;font-size:11px;background:#ffad25;color:#17214f;margin:0;border-bottom:1px solid #e3e8ed}iframe{display:block;width:100%;height:calc(100dvh - 100px);min-height:420px;border:0}@media(max-width:600px){.preview-tools strong{width:100%}.preview-tools{gap:7px}iframe{height:calc(100dvh - 150px)}}
</style></head><body><div class="preview-tools" aria-label="Controles da prévia"><strong>Instituto Mais Amor · Prévia navegável</strong><label class="upload">Adicionar logomarca<input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Selecionar a logomarca original em PNG, JPG ou WebP"></label><button id="save-preview" type="button">Baixar prévia com logo</button><button id="save-site" type="button">Baixar site para Hostinger</button></div><p id="preview-status" class="statusline" role="status">Navegue pelo site abaixo. A logomarca pode ser adicionada do seu dispositivo, sem envio a servidores.</p><iframe id="site" title="Portal Instituto Mais Amor" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
<script id="preview-data" type="application/json">__PREVIEW_DATA__</script>
<script>
const bundle=JSON.parse(document.getElementById('preview-data').textContent);
let logoData=bundle.logoData||'',logoExtension=bundle.logoExtension||'png';
const frame=document.getElementById('site'),statusLine=document.getElementById('preview-status');
function applyBrand(html,src){if(!src)return html;const doc=new DOMParser().parseFromString(html,'text/html');for(const element of doc.querySelectorAll('.brand')){const img=doc.createElement('img');img.src=src;img.alt='Instituto Mais Amor — Inclusão, Cuidado e Empatia';img.width=140;img.height=140;element.className='brand brand-official';element.replaceChildren(img);}for(const image of doc.querySelectorAll('.logo-sticker img,.brand-corner img'))image.src=src;return '<!doctype html>'+doc.documentElement.outerHTML;}
const assetURLs=new Map();
function assetURL(path){if(!Object.hasOwn(bundle.files,path))return path;if(!assetURLs.has(path)){const ext=path.split('.').pop().toLowerCase();const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',vtt:'text/vtt',ttf:'font/ttf',woff2:'font/woff2'}[ext]||'application/octet-stream';assetURLs.set(path,URL.createObjectURL(new Blob([decode64(bundle.files[path])],{type:mime})));}return assetURLs.get(path);}
function applyAssets(html){return html.replace(/(src|poster)="(assets\/[^"\s]+)"/g,(_,attr,path)=>attr+'="'+assetURL(path)+'"').replace(/url\((['"]?)(assets\/[^)'"\s]+)\1\)/g,(_,quote,path)=>'url("'+assetURL(path)+'")');}
function route(){return location.hash.slice(1)||'index.html';}
function show(path,push=true){const [file,hash]=path.split('#'),key=file||'index.html';if(!Object.hasOwn(bundle.pages,key))return;frame.onload=()=>{if(hash)frame.contentDocument?.getElementById(hash)?.scrollIntoView();};frame.srcdoc=applyBrand(applyAssets(bundle.pages[key]),logoData);if(push)history.pushState({path},'','#'+path);}
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.type==='navigate'&&typeof event.data.path==='string')show(event.data.path);});
window.addEventListener('popstate',()=>show(route(),false));
const upload=document.getElementById('logo-file');
upload.addEventListener('change',async()=>{const file=upload.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10*1024*1024){statusLine.textContent='Selecione um arquivo PNG, JPG ou WebP de até 10 MB.';upload.value='';return;}try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});await new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=reject;image.src=data;});logoData=data;logoExtension=({'image/png':'png','image/jpeg':'jpg','image/webp':'webp'})[file.type];show(route(),false);statusLine.textContent='Logomarca original aplicada ao cabeçalho e ao rodapé. Baixe a prévia ou o site para manter a alteração.';}catch{statusLine.textContent='Não foi possível abrir a imagem. Escolha outro arquivo válido.';}});
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadPreview(){const documentCopy=document.documentElement.cloneNode(true);documentCopy.querySelector('#site').removeAttribute('srcdoc');documentCopy.querySelector('#preview-data').textContent=JSON.stringify({...bundle,logoData,logoExtension}).replace(/</g,'\\u003c');documentCopy.querySelector('#preview-status').textContent=logoData?'Logomarca incorporada a esta prévia.':'Navegue pelo site abaixo.';download(new Blob(['<!doctype html>'+documentCopy.outerHTML],{type:'text/html;charset=utf-8'}),'Instituto-Mais-Amor-previa.html');}
function decode64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
const encoder=new TextEncoder();
// Small ZIP writer using stored entries, UTF-8 filenames, and CRC-32. No external library.
const crcTable=Uint32Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
function crc32(bytes){let crc=0xffffffff;for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);return (crc^0xffffffff)>>>0;}
function makeZip(files){const local=[],central=[];let offset=0,centralSize=0;for(const [name,bytes] of Object.entries(files)){const filename=encoder.encode(name),crc=crc32(bytes);const header=new Uint8Array(30+filename.length),h=new DataView(header.buffer);h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,33,true);h.setUint32(14,crc,true);h.setUint32(18,bytes.length,true);h.setUint32(22,bytes.length,true);h.setUint16(26,filename.length,true);header.set(filename,30);local.push(header,bytes);const directory=new Uint8Array(46+filename.length),d=new DataView(directory.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,33,true);d.setUint32(16,crc,true);d.setUint32(20,bytes.length,true);d.setUint32(24,bytes.length,true);d.setUint16(28,filename.length,true);d.setUint32(42,offset,true);directory.set(filename,46);central.push(directory);centralSize+=directory.length;offset+=header.length+bytes.length;}
const end=new Uint8Array(22),e=new DataView(end.buffer),count=Object.keys(files).length;e.setUint32(0,0x06054b50,true);e.setUint16(8,count,true);e.setUint16(10,count,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);return new Blob([...local,...central,end],{type:'application/zip'});}
function siteFiles(){const files=Object.fromEntries(Object.entries(bundle.files).map(([name,data])=>[name,decode64(data)]));if(logoData){const path='assets/logo-oficial.'+logoExtension;files[path]=decode64(logoData.split(',')[1]);for(const name of Object.keys(files))if(name.endsWith('.html'))files[name]=encoder.encode(applyBrand(new TextDecoder().decode(files[name]),path));}return files;}
document.getElementById('save-preview').addEventListener('click',downloadPreview);
document.getElementById('save-site').addEventListener('click',()=>{download(makeZip(siteFiles()),'Instituto-Mais-Amor-Hostinger.zip');statusLine.textContent='Site exportado. Envie o conteúdo do ZIP para public_html na Hostinger. Os contatos não configurados e os formulários continuam desativados.';});
show(route(),false);
</script></body></html>
